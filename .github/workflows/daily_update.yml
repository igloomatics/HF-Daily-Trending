name: Daily Paper Update

# 触发条件：定时触发 + 手动触发
on:
  schedule:
    # cron 语法: 分 时 日 月 周 (UTC时间)
    # 每天 UTC 05:00 对应北京时间 13:00
    - cron: '0 5 * * *'
  workflow_dispatch: # 允许你手动点击按钮立刻测试，不用傻等明天

# 赋予脚本写入仓库的权限 (非常重要，否则无法 push 更新后的 README)
permissions:
  contents: write

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    steps:
    # 1. 检出代码
    - name: Checkout code
      uses: actions/checkout@v3

    # 2. 设置 Python 环境
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    # 3. 安装依赖
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # 安装你的脚本需要的库
        pip install requests huggingface_hub

    # 4. 运行你的脚本
    # 注意：Github 服务器在海外，不需要设置 HF_ENDPOINT 镜像或代理
    - name: Run daily trend script
      run: python daily_trend.py

    # 5. 提交并推送到 GitHub
    - name: Commit and push changes
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        
        # 检查是否有文件变化
        if [[ -n $(git status -s) ]]; then
          git add README.md docs/papers.json # 确保添加了你生成的文件
          git commit -m "📝 Update Daily Papers: $(date +'%Y-%m-%d')"
          git push
        else
          echo "No changes to commit."
        fi